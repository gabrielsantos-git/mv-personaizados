<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/login.css">
    <title>Login - Mv Personalizados</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-dark.svg" media="(prefers-color-scheme: dark)">
</head>
<body>
    <header class="headerLogin">
        <a href="index.html"><img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados"></a>
    </header>

    <main class="loginPage">
        <div class="faixaLogin">
            <img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados" class="logoFaixaLogin">
        </div>

        <div class="areaFormLogin">
            <form action="" class="cardLogin" id="formLogin">
                <h1>Login</h1>

                <div class="campoLogin">
                    <label for="usuario">Usuário</label>
                    <input type="email" name="usuario" id="usuario" placeholder="exemplo@email.com" required>
                </div>

                <div class="campoLogin">
                    <label for="senha">Senha</label>
                    <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
                    <a href="esqueci-senha.html" class="linkEsqueciSenha">Esqueci minha senha</a>
                </div>

                <p class="mensagemAuth" id="mensagemLogin"></p>

                <button type="submit" class="botaoFazerLogin">Fazer Login</button>

                <a href="cadastro.html" class="linkCriarConta">Criar conta</a>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/supabaseClient.js';

        const form = document.getElementById('formLogin');
        const mensagem = document.getElementById('mensagemLogin');
        const botao = form.querySelector('.botaoFazerLogin');

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensagem.textContent = '';

            const email = document.getElementById('usuario').value.trim();
            const senha = document.getElementById('senha').value;

            botao.disabled = true;
            botao.textContent = 'Entrando...';

            const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

            if (error) {
                botao.disabled = false;
                botao.textContent = 'Fazer Login';
                mensagem.textContent = 'Email ou senha inválidos.';
                return;
            }

            const redirect = new URLSearchParams(window.location.search).get('redirect');
            if (redirect) {
                window.location.href = decodeURIComponent(redirect);
                return;
            }

            const { data: perfil } = await supabase
                .from('profiles')
                .select('is_admin')
                .eq('id', data.user.id)
                .single();

            window.location.href = perfil?.is_admin ? 'adm/diagnostico.html' : 'index.html';
        });
    </script>
</body>
</html>
