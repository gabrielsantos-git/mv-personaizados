<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/cadastro.css">
    <title>Criar Conta - Mv Personalizados</title>
</head>
<body>
    <header class="headerLogin">
        <a href="index.html"><img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados"></a>
    </header>

    <main class="loginPage">
        <div class="faixaLogin">
            <img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados" class="logoFaixaLogin">
        </div>

        <div class="areaFormLogin">
            <form action="" class="cardLogin cardCadastro" id="formCadastro">
                <h1>Criar Conta</h1>

                <div class="linhaCampoLogin">
                    <div class="campoLogin">
                        <label for="nome">Nome</label>
                        <input type="text" name="nome" id="nome" placeholder="Seu nome" required>
                    </div>

                    <div class="campoLogin">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" name="sobrenome" id="sobrenome" placeholder="Seu sobrenome" required>
                    </div>
                </div>

                <div class="campoLogin">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="linhaCampoLogin">
                    <div class="campoLogin">
                        <label for="telefone">Telefone</label>
                        <input type="tel" name="telefone" id="telefone" placeholder="(71) 99999-9999">
                    </div>

                    <div class="campoLogin">
                        <label for="cep">CEP</label>
                        <input type="text" name="cep" id="cep" placeholder="00000-000">
                    </div>
                </div>

                <div class="linhaCampoLogin">
                    <div class="campoLogin">
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha" placeholder="Escolha uma senha" minlength="6" required>
                    </div>

                    <div class="campoLogin">
                        <label for="confirmarSenha">Confirmar Senha</label>
                        <input type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Confirme a senha" minlength="6" required>
                    </div>
                </div>

                <p class="mensagemAuth" id="mensagemCadastro"></p>

                <button type="submit" class="botaoFazerLogin">Criar Conta</button>

                <a href="login.html" class="linkCriarConta">Já tenho uma conta</a>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/supabaseClient.js';

        const form = document.getElementById('formCadastro');
        const mensagem = document.getElementById('mensagemCadastro');
        const botao = form.querySelector('.botaoFazerLogin');

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensagem.textContent = '';

            const nome = document.getElementById('nome').value.trim();
            const sobrenome = document.getElementById('sobrenome').value.trim();
            const email = document.getElementById('email').value.trim();
            const telefone = document.getElementById('telefone').value.trim();
            const cep = document.getElementById('cep').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;

            if (senha !== confirmarSenha) {
                mensagem.textContent = 'As senhas não coincidem.';
                return;
            }

            botao.disabled = true;
            botao.textContent = 'Criando conta...';

            const { data, error } = await supabase.auth.signUp({
                email,
                password: senha,
                options: {
                    data: { nome, sobrenome, telefone, cep }
                }
            });

            if (error) {
                botao.disabled = false;
                botao.textContent = 'Criar Conta';
                mensagem.textContent = error.message === 'User already registered'
                    ? 'Esse email já tem uma conta.'
                    : 'Não foi possível criar a conta.';
                return;
            }

            // Se já existe sessão (confirmação de email desativada), garante que o perfil
            // está salvo (o gatilho no banco também cria essa linha automaticamente).
            if (data.session && data.user) {
                await supabase.from('profiles').upsert({
                    id: data.user.id,
                    nome,
                    sobrenome,
                    telefone,
                    cep
                });

                botao.disabled = false;
                window.location.href = 'index.html';
                return;
            }

            botao.disabled = false;
            botao.textContent = 'Criar Conta';
            mensagem.textContent = 'Conta criada! Verifique seu email para confirmar antes de entrar.';
            form.reset();
        });
    </script>
</body>
</html>
