<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/login.css">
    <title>Inserir Código - Mv Personalizados</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/svg+xml" href="assets/favicon-dark.svg" media="(prefers-color-scheme: dark)">
</head>
<body>
    <header class="headerLogin">
        <a href="index.html"><img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados"></a>
    </header>

    <main class="loginPage">
        <div class="faixaLogin">
            <img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados" class="logoFaixaLogin">
        </div>

        <div class="areaFormLogin">
            <form action="" class="cardLogin" id="formCodigo">
                <div>
                    <h1 style="margin-bottom: 12px;">Inserir Código</h1>
                    <p style="font-family: 'Almarai', sans-serif; font-size: 16px; color: white; opacity: 0.8; text-align: center; margin: 0;">
                        Enviamos um código de verificação para o seu e-mail. Insira o código abaixo para confirmar sua conta.
                        <br>
                        <strong id="emailCodigo" style="opacity: 1;"></strong>
                    </p>
                </div>

                <div class="gradeCodigo" id="gradeCodigo">
                    <input type="text" inputmode="numeric" maxlength="1" class="campoDigito" autocomplete="one-time-code">
                    <input type="text" inputmode="numeric" maxlength="1" class="campoDigito">
                    <input type="text" inputmode="numeric" maxlength="1" class="campoDigito">
                    <input type="text" inputmode="numeric" maxlength="1" class="campoDigito">
                    <input type="text" inputmode="numeric" maxlength="1" class="campoDigito">
                    <input type="text" inputmode="numeric" maxlength="1" class="campoDigito">
                </div>

                <p class="mensagemAuth" id="mensagemCodigo"></p>

                <div class="acoesCodigo">
                    <button type="submit" class="botaoFazerLogin" id="botaoVerificar">Verificar Código</button>
                    <button type="button" class="linkAuxiliarCodigo" id="botaoReenviar">Reenviar código</button>
                    <a href="login.html" class="linkAuxiliarCodigo" style="text-decoration: underline;">Voltar para login</a>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        import { supabase } from './assets/supabaseClient.js';

        const params = new URLSearchParams(window.location.search);
        const email = params.get('email') || '';

        if (!email) {
            // Não tem como confirmar código sem saber o email — volta pro cadastro.
            window.location.href = 'cadastro.html';
        }

        document.getElementById('emailCodigo').textContent = email;

        const form = document.getElementById('formCodigo');
        const mensagem = document.getElementById('mensagemCodigo');
        const botaoVerificar = document.getElementById('botaoVerificar');
        const botaoReenviar = document.getElementById('botaoReenviar');
        const grade = document.getElementById('gradeCodigo');
        const campos = [...grade.querySelectorAll('.campoDigito')];

        // Só dígito em cada campo, avança pro próximo ao digitar e volta ao
        // apagar — o padrão usual de campo de código de verificação.
        campos.forEach((campo, indice) => {
            campo.addEventListener('input', () => {
                campo.value = campo.value.replace(/[^0-9]/g, '').slice(0, 1);
                if (campo.value && indice < campos.length - 1) {
                    campos[indice + 1].focus();
                }
            });

            campo.addEventListener('keydown', (evento) => {
                if (evento.key === 'Backspace' && !campo.value && indice > 0) {
                    campos[indice - 1].focus();
                }
            });

            // Cola o código inteiro de uma vez (ex: veio copiado do email).
            campo.addEventListener('paste', (evento) => {
                const colado = (evento.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
                if (!colado) return;
                evento.preventDefault();
                colado.slice(0, campos.length).split('').forEach((digito, i) => {
                    if (campos[i]) campos[i].value = digito;
                });
                const proximo = campos[Math.min(colado.length, campos.length - 1)];
                proximo.focus();
            });
        });

        campos[0].focus();

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensagem.textContent = '';

            const codigo = campos.map((c) => c.value).join('');
            if (codigo.length < campos.length) {
                mensagem.textContent = 'Preencha todos os dígitos do código.';
                return;
            }

            botaoVerificar.disabled = true;
            botaoVerificar.textContent = 'Verificando...';

            const { error } = await supabase.auth.verifyOtp({ email, token: codigo, type: 'signup' });

            botaoVerificar.disabled = false;
            botaoVerificar.textContent = 'Verificar Código';

            if (error) {
                mensagem.textContent = 'Código incorreto ou expirado. Confira e tente de novo.';
                campos.forEach((c) => { c.value = ''; });
                campos[0].focus();
                return;
            }

            // Email confirmado, conta ativa e já logado — segue pra loja.
            window.location.href = 'index.html';
        });

        let cooldown = 0;
        let temporizador = null;

        function atualizarBotaoReenviar() {
            if (cooldown > 0) {
                botaoReenviar.disabled = true;
                botaoReenviar.textContent = `Reenviar código (${cooldown}s)`;
            } else {
                botaoReenviar.disabled = false;
                botaoReenviar.textContent = 'Reenviar código';
                clearInterval(temporizador);
            }
        }

        botaoReenviar.addEventListener('click', async () => {
            mensagem.textContent = '';
            botaoReenviar.disabled = true;

            const { error } = await supabase.auth.resend({ type: 'signup', email });

            if (error) {
                mensagem.textContent = 'Não foi possível reenviar o código agora. Tente novamente em instantes.';
                botaoReenviar.disabled = false;
                return;
            }

            mensagem.textContent = 'Código reenviado! Confira seu email.';
            cooldown = 60;
            atualizarBotaoReenviar();
            temporizador = setInterval(() => {
                cooldown -= 1;
                atualizarBotaoReenviar();
            }, 1000);
        });
    </script>
</body>
</html>
