        <div class="areaConteudoAdm">
            <div class="cabecalhoTopoAdm">
                <div class="tituloTopoAdm">
                    <h1>Configurações</h1>
                    <p>Edite as informações da empresa exibidas no site (contato, endereço e horário de atendimento).</p>
                </div>
            </div>

            <form class="cardFormProduto" id="formConfiguracoes">
                <div class="secaoFormProduto">
                    <h3>Informações da Empresa</h3>
                    <p class="descricaoSecaoForm">Esses dados aparecem no rodapé e na página de contato da loja.</p>

                    <div class="linhaFormProduto">
                        <div class="campoFormProduto">
                            <label for="email">E-mail da empresa</label>
                            <input type="email" id="email" placeholder="contato@empresa.com">
                        </div>

                        <div class="campoFormProduto">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                        </div>
                    </div>

                    <div class="linhaFormProduto">
                        <div class="campoFormProduto">
                            <label for="telefone">Contato (telefone/WhatsApp)</label>
                            <input type="text" id="telefone" placeholder="(00) 00000-0000">
                        </div>

                        <div class="campoFormProduto">
                            <label for="horarioAtendimento">Horário de Atendimento</label>
                            <input type="text" id="horarioAtendimento" placeholder="Ex: Segunda a sexta, das 8h às 17h">
                        </div>
                    </div>

                    <div class="campoFormProduto campoFormProdutoFull">
                        <label for="endereco">Endereço</label>
                        <textarea id="endereco" placeholder="Rua, número - Bairro - Cidade - Estado"></textarea>
                    </div>
                </div>

                <p class="mensagemFormProduto" id="mensagemConfiguracoes"></p>

                <div class="acoesFormProduto">
                    <button type="submit" class="botaoSalvarProduto" id="botaoSalvarConfiguracoes">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../assets/supabaseClient.js';

        const form = document.getElementById('formConfiguracoes');
        const mensagem = document.getElementById('mensagemConfiguracoes');
        const botaoSalvar = document.getElementById('botaoSalvarConfiguracoes');

        async function carregarConfiguracoes() {
            const { data, error } = await supabase
                .from('configuracoes_loja')
                .select('*')
                .eq('id', 1)
                .single();

            if (error || !data) {
                mensagem.textContent = 'Não foi possível carregar as configurações.';
                mensagem.classList.add('mensagemErro');
                return;
            }

            document.getElementById('email').value = data.email || '';
            document.getElementById('cnpj').value = data.cnpj || '';
            document.getElementById('telefone').value = data.telefone || '';
            document.getElementById('horarioAtendimento').value = data.horario_atendimento || '';
            document.getElementById('endereco').value = data.endereco || '';
        }

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            mensagem.textContent = '';
            mensagem.classList.remove('mensagemErro', 'mensagemSucesso');

            const payload = {
                email: document.getElementById('email').value.trim(),
                cnpj: document.getElementById('cnpj').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                horario_atendimento: document.getElementById('horarioAtendimento').value.trim(),
                endereco: document.getElementById('endereco').value.trim(),
                updated_at: new Date().toISOString()
            };

            botaoSalvar.disabled = true;
            botaoSalvar.textContent = 'Salvando...';

            const { error } = await supabase.from('configuracoes_loja').update(payload).eq('id', 1);

            botaoSalvar.disabled = false;
            botaoSalvar.textContent = 'Salvar Alterações';

            if (error) {
                mensagem.textContent = 'Não foi possível salvar as configurações.';
                mensagem.classList.add('mensagemErro');
                return;
            }

            mensagem.textContent = 'Configurações salvas com sucesso!';
            mensagem.classList.add('mensagemSucesso');
            setTimeout(() => { mensagem.textContent = ''; mensagem.classList.remove('mensagemSucesso'); }, 3000);
        });

        carregarConfiguracoes();
    </script>
