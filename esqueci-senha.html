<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/esqueci-senha.css">
    <title>Redefinir Senha - Mv Personalizados</title>
</head>
<body>
    <header class="headerLogin">
        <a href="index.html"><img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados"></a>
    </header>

    <main class="loginPage">
        <div class="faixaLogin">
            <img src="assets/MvPersonalizados.svg" alt="Logo Mv Personalizados" class="logoFaixaLogin">
        </div>

        <div class="areaFormLogin">
            <form action="" class="cardLogin">
                <h1>Redefinir Senha</h1>

                <div class="campoLogin">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" name="novaSenha" id="novaSenha" placeholder="Digite a nova senha">
                </div>

                <div class="campoLogin">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Confirme a nova senha">
                </div>

                <button type="submit" class="botaoFazerLogin">Redefinir Senha</button>

                <a href="login.html" class="linkCriarConta">Voltar para Login</a>
            </form>
        </div>
    </main>
</body>
</html>
